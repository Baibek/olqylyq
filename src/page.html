<style>
/* Layout: "Тексерілген дәптер" — squared school paper, pen-ink blue, the teacher's red pen marks only the gaps; one working column (max 1160px) */
:root {
  --bg: #F3F5F9; --bg-2: #EBEFF6; --surface: #FFFFFF; --sunk: #ECF0F6;
  --ink: #1A2233; --muted: #566074; --line: #DCE3EE; --line-strong: #8A95A9; --edge: #B8C3D5;
  --primary: #2340A8; --primary-2: #3550C4; --primary-tint: #E9EEFB; --on-primary: #FFFFFF;
  --gold: #F5CF2E; --gold-ink: #6B5300; --gold-tint: #FFF5C7;
  --accent: #2340A8; --accent-tint: #E9EEFB;
  --ok: #1D7A4C; --ok-tint: #E4F3EA; --gap: #C8243A; --gap-tint: #FCE8EA; --on-gap: #FFFFFF; --unk: #7A8597;
  --pen: #D2283B; --grid: #E3E9F3; --margin: #F2B8C0;
  --shadow-1: 0 1px 0 rgba(26, 34, 51, .04);
  --shadow-2: 0 1px 0 rgba(26, 34, 51, .04), 0 10px 28px -18px rgba(26, 34, 51, .35);
  --ring: 0 0 0 3px color-mix(in srgb, var(--primary) 28%, transparent);
  --glass: color-mix(in srgb, var(--surface) 78%, transparent);
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-sans: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --t-14: 14px; --t-16: 16px; --t-20: 20px; --t-24: 24px; --t-32: 32px; --t-48: 48px;
  --s-1: 4px; --s-2: 8px; --s-3: 16px; --s-4: 24px; --s-5: 32px; --s-6: 48px; --s-7: 64px;
  --r: 8px; --r-sm: 6px; --tap: 44px; --dur: 200ms; --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15201C; --bg-2: #19261F; --surface: #1C2A24; --sunk: #23342D;
  --ink: #ECF1EC; --muted: #A5B4AC; --line: #2F433B; --line-strong: #6F877C; --edge: #3E554B;
  --primary: #A5BDFF; --primary-2: #C0D0FF; --primary-tint: #263A45; --on-primary: #0E1A33;
  --gold: #F4E27A; --gold-ink: #F4E27A; --gold-tint: #393A22;
  --accent: #A5BDFF; --accent-tint: #263A45;
  --ok: #82DBA6; --ok-tint: #1E3B2D; --gap: #FF9494; --gap-tint: #46262B; --on-gap: #2A0A0E; --unk: #879A91;
  --pen: #FF9494; --grid: rgba(236, 241, 236, .055); --margin: rgba(255, 148, 148, .35);
  --shadow-1: none; --shadow-2: 0 12px 30px -18px rgba(0, 0, 0, .7);
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15201C; --bg-2: #19261F; --surface: #1C2A24; --sunk: #23342D;
  --ink: #ECF1EC; --muted: #A5B4AC; --line: #2F433B; --line-strong: #6F877C; --edge: #3E554B;
  --primary: #A5BDFF; --primary-2: #C0D0FF; --primary-tint: #263A45; --on-primary: #0E1A33;
  --gold: #F4E27A; --gold-ink: #F4E27A; --gold-tint: #393A22;
  --accent: #A5BDFF; --accent-tint: #263A45;
  --ok: #82DBA6; --ok-tint: #1E3B2D; --gap: #FF9494; --gap-tint: #46262B; --on-gap: #2A0A0E; --unk: #879A91;
  --pen: #FF9494; --grid: rgba(236, 241, 236, .055); --margin: rgba(255, 148, 148, .35);
  --shadow-1: none; --shadow-2: 0 12px 30px -18px rgba(0, 0, 0, .7);
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: var(--t-16); line-height: 1.6; -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(1200px 520px at 85% -10%, color-mix(in srgb, var(--primary-2) 14%, transparent), transparent 70%), radial-gradient(900px 420px at -10% 0%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 70%);
  background-repeat: no-repeat;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--gold) 45%, transparent); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.02em; line-height: 1.15; }
h3, .h3 { font-family: var(--f-sans); font-size: var(--t-16); font-weight: 650; letter-spacing: -0.005em; line-height: 1.4; margin: 0; }
h1 { font-size: var(--t-48); }
h2 { font-size: var(--t-24); }
@media (max-width: 640px) { h1 { font-size: var(--t-32); } h2 { font-size: var(--t-20); } }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: var(--t-14); }
.eyebrow { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--t-14); font-weight: 600; color: var(--gold-ink); background: var(--gold-tint); padding: 2px var(--s-3) 2px var(--s-2); border-radius: 999px; }
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: var(--t-14); color: var(--muted); max-width: 72ch; }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* motion primitives */
@media (prefers-reduced-motion: no-preference) {
  .view:not([hidden]) > * { animation: rise 420ms var(--ease) both; }
  .view:not([hidden]) > *:nth-child(2) { animation-delay: 60ms; }
  .view:not([hidden]) > *:nth-child(3) { animation-delay: 120ms; }
  .view:not([hidden]) > *:nth-child(4) { animation-delay: 180ms; }
  .view:not([hidden]) > *:nth-child(5) { animation-delay: 240ms; }
  .view:not([hidden]) > *:nth-child(n+6) { animation-delay: 280ms; }
  .tiles > * , .courses > *, .subjects > *, .how > * { animation: rise 420ms var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
}
@keyframes rise { from { opacity: .001; transform: translateY(12px); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* skip link */
.skip { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 20; transform: translateY(-200%); background: var(--ink); color: var(--surface); border: 0; border-radius: 999px; min-height: var(--tap); padding: 0 var(--s-4); font-weight: 600; cursor: pointer; }
.skip:focus-visible { transform: none; }

/* header: glass bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--glass); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top .wrap { display: flex; align-items: center; gap: var(--s-2); padding-block: var(--s-2); }
.brand { display: flex; align-items: center; gap: var(--s-2); min-height: var(--tap); min-width: var(--tap); font-family: var(--f-display); font-weight: 700; font-size: var(--t-16); white-space: nowrap; background: none; border: 0; padding: 0 var(--s-1); border-radius: var(--r-sm); cursor: pointer; }
.brand svg { flex: none; transition: transform 500ms var(--spring); }
.brand:hover svg { transform: rotate(-12deg) scale(1.06); }
.tabs { position: relative; display: flex; gap: 2px; margin-left: auto; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--sunk) 80%, transparent); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; border: 0; background: none; min-height: 40px; padding: 0 var(--s-3); border-radius: 999px; cursor: pointer; color: var(--muted); font-size: var(--t-14); font-weight: 600; white-space: nowrap; transition: color var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.tab:hover { color: var(--ink); }
.tab:active { transform: scale(.97); }
.tab[aria-current="page"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }
.seg { display: inline-flex; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--sunk) 80%, transparent); padding: 2px; flex: none; }
.seg button { border: 0; background: none; min-height: 40px; min-width: 44px; padding: 0 var(--s-2); border-radius: 999px; cursor: pointer; font-size: var(--t-14); font-weight: 700; color: var(--muted); transition: background var(--dur) var(--ease), color var(--dur); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
@media (max-width: 560px) {
  .brand span { display: none; }
  .top .wrap { gap: var(--s-1); }
  .tabs { padding: 2px; }
  .tab { padding: 0 10px; }
  .seg button[aria-pressed="true"] { display: none; }
}

main { padding-block: var(--s-5) var(--s-7); }
main:focus { outline: none; }
.view { display: grid; gap: var(--s-5); }
.view > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); padding: var(--s-4); min-width: 0; }
@media (max-width: 640px) { .card { padding: var(--s-3); border-radius: 14px; } main { padding-block: var(--s-3) var(--s-6); } .view { gap: var(--s-3); } }

/* buttons */
.btn { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 48px; padding: 0 var(--s-4); border-radius: 999px; border: 1px solid transparent; font-size: var(--t-16); font-weight: 650; line-height: 1.2; cursor: pointer; text-decoration: none; transition: transform 180ms var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur); }
.btn-primary { background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 70%, var(--primary-2))); color: var(--on-primary); box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--primary) 60%, transparent); }
.btn-primary::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%); background-size: 250% 100%; background-position: 200% 0; transition: background-position 700ms var(--ease); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--primary) 70%, transparent); }
.btn-primary:hover::before { background-position: -50% 0; }
.btn-ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
.btn:focus-visible { outline: none; box-shadow: var(--ring); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-sm { min-height: var(--tap); font-size: var(--t-14); padding: 0 var(--s-3); }
.btn .ico { transition: transform var(--dur) var(--spring); }
.btn:hover .ico { transform: translateX(2px); }
.subjseg button { position: relative; }
.btn[aria-busy="true"], .subjseg button[aria-busy="true"] { color: transparent; pointer-events: none; }
.btn[aria-busy="true"]::after, .subjseg button[aria-busy="true"]::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 0%, var(--line-strong)); border-top-color: var(--gold); animation: spin 700ms linear infinite; }
.chip { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--t-14); font-weight: 550; line-height: 1.4; padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.unt { background: var(--gold-tint); color: var(--gold-ink); }
.chip.gap { background: var(--gap-tint); color: var(--gap); }
.chip.root { background: var(--gap); color: var(--on-gap); }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }

/* subject picker: icon tiles */
.subjects { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-3); }
.subj { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); min-height: var(--tap); padding: var(--s-3); cursor: pointer; display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: var(--s-3); row-gap: 2px; align-items: center; min-width: 0; box-shadow: var(--shadow-1); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur); }
.subj .sic { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-tint); color: var(--primary); transition: background var(--dur), color var(--dur), transform 500ms var(--spring); }
.subj .sic svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.subj b { font-size: var(--t-16); font-weight: 650; line-height: 1.3; }
.subj span:not(.sic) { font-size: var(--t-14); color: var(--muted); }
.subj:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--primary) 35%, var(--line)); }
.subj:hover .sic { transform: rotate(-8deg) scale(1.06); }
.subj:active { transform: translateY(0) scale(.99); }
.subj[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), var(--shadow-2); }
.subj[aria-pressed="true"] .sic { background: var(--primary); color: var(--on-primary); }
.subj[aria-pressed="true"]::after { content: ""; position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 28%, transparent); }
@media (max-width: 960px) { .subjects { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .subjects { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 8px; scroll-snap-type: x mandatory; }
  .subj { flex: none; scroll-snap-align: start; min-height: 52px; padding: 6px var(--s-3) 6px 6px; grid-template-columns: 40px auto; box-shadow: none; }
  .subj .sic { width: 40px; height: 40px; grid-row: auto; }
  .subj span:not(.sic) { display: none; }
  .subj[aria-pressed="true"]::after { display: none; }
}
.subjseg { display: flex; flex-wrap: wrap; gap: var(--s-1); padding: 4px; border-radius: 999px; background: var(--sunk); width: fit-content; max-width: 100%; }
.subjseg button { border: 0; background: none; border-radius: 999px; min-height: var(--tap); padding: 0 var(--s-3); cursor: pointer; font-weight: 600; font-size: var(--t-14); color: var(--muted); transition: background var(--dur), color var(--dur); }
.subjseg button:hover { color: var(--ink); }
.subjseg button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }
@media (max-width: 640px) { .subjseg { border-radius: var(--r); width: 100%; } .subjseg button { flex: 1 1 45%; } }

/* home hero with live constellation */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s-5); align-items: start; }
.hero-text { position: relative; z-index: 1; display: grid; gap: var(--s-3); align-content: start; }
.hero h1 { margin-top: var(--s-2); }
.hero h1 em { font-style: normal; color: var(--primary); background: linear-gradient(transparent 62%, color-mix(in srgb, var(--gold) 45%, transparent) 62%); padding: 0 2px; }
.hero .lead { font-size: var(--t-20); line-height: 1.5; color: var(--muted); max-width: 50ch; }
.constellation { display: block; width: 100%; max-width: 520px; height: auto; margin-top: var(--s-2); pointer-events: none; }
.constellation .c-ed { stroke: var(--edge); stroke-width: 1.5; fill: none; }
.constellation .c-nd { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.constellation .c-ok { fill: var(--ok-tint); stroke: var(--ok); }
.constellation .c-gap { fill: var(--gap-tint); stroke: var(--gap); }
.constellation .c-root { fill: var(--gap); stroke: var(--gap); }
.constellation .c-trace { stroke: var(--gold); stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 6 8; }
@media (prefers-reduced-motion: no-preference) {
  .constellation .c-nd { animation: lit 6s var(--ease) infinite; animation-delay: calc(var(--d) * 1s); }
  .constellation .c-trace { animation: trace 6s linear infinite; }
  .constellation .c-root { animation: beat 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
}
@keyframes lit { 0%, 12% { fill: var(--surface); stroke: var(--line-strong); } 22%, 80% { fill: var(--ok-tint); stroke: var(--ok); } 100% { fill: var(--surface); stroke: var(--line-strong); } }
@keyframes trace { from { stroke-dashoffset: 140; } to { stroke-dashoffset: 0; } }
@keyframes beat { 50% { transform: scale(1.18); } }
@media (max-width: 860px) { .constellation { display: none; } }
.facts { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.facts span { font-size: var(--t-14); color: var(--ink); display: inline-flex; gap: var(--s-2); align-items: center; padding: 4px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); }
.facts span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.startcard { position: relative; z-index: 1; display: grid; gap: var(--s-3); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--primary) 18%, var(--line)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px); }
.startcard::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; border-radius: var(--r) var(--r) 0 0; background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--gold)); }
.startcard h2 { font-size: var(--t-20); }
.field { display: grid; gap: var(--s-2); }
.field label, .lbl { font-size: var(--t-14); font-weight: 600; color: var(--ink); }
.input { min-height: 48px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 0 var(--s-3); width: 100%; font-size: var(--t-16); transition: border-color var(--dur), box-shadow var(--dur); }
.input:hover { border-color: var(--ink); }
.input:focus-visible { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.input::placeholder { color: var(--muted); opacity: 1; }
.gradeseg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--sunk); }
.gradeseg button { border: 0; border-radius: 10px; background: none; min-height: 40px; cursor: pointer; font-weight: 650; font-size: var(--t-14); color: var(--muted); transition: background var(--dur), color var(--dur), transform 150ms; }
.gradeseg button:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.gradeseg button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }
.gradeseg button:active:not([aria-pressed="true"]), .subjseg button:active:not([aria-pressed="true"]), .seg button:active:not([aria-pressed="true"]) { transform: scale(.96); }
.startcard .btn { width: 100%; }
.note { font-size: var(--t-14); color: var(--muted); }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); }
.how .step { position: relative; display: grid; gap: var(--s-2); align-content: start; overflow: hidden; transition: transform var(--dur) var(--ease), box-shadow var(--dur); }
.how .step:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
.how .step b { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-size: var(--t-14); color: var(--on-primary); background: var(--primary); }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s-1) var(--s-3); margin-bottom: var(--s-3); }
.sec-head > span { font-size: var(--t-14); }

.pkgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); align-items: stretch; margin-bottom: var(--s-5); }
@media (max-width: 900px) { .pkgs { grid-template-columns: minmax(0, 1fr); } }
.pkg { position: relative; display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4); border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); overflow: hidden; transition: transform var(--dur) var(--ease), box-shadow var(--dur); }
.pkg:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }
.pkg-best { color: #F3FAFC; border: 0; background: radial-gradient(420px 220px at 100% 0%, color-mix(in srgb, #F2B33D 45%, transparent), transparent 60%), linear-gradient(150deg, #00546A, #0A3A4A 55%, #10242D); box-shadow: 0 24px 48px -18px rgba(0, 84, 106, .55); }
.pkg-best::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: conic-gradient(from var(--ang, 0deg), #F2B33D, #7ADCEE, #F2B33D 40%, transparent 60%, #F2B33D); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.pkg-best::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .14) 50%, transparent 65%); background-size: 250% 100%; background-position: 200% 0; pointer-events: none; }
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@media (prefers-reduced-motion: no-preference) { .pkg-best::before { animation: orbit 6s linear infinite; } .pkg-best::after { animation: shimmer 5s ease-in-out infinite; } .pkg-flag { animation: beat 2.4s ease-in-out infinite; } }
@keyframes orbit { to { --ang: 360deg; } }
@media (min-width: 901px) { .pkg-best { transform: translateY(-8px); } .pkg-best:hover { transform: translateY(-12px); } }
.pkg-flag { position: absolute; top: 16px; right: 16px; padding: 4px 12px; border-radius: 999px; background: #F2B33D; color: #3A2600; font-size: var(--t-14); font-weight: 700; box-shadow: 0 6px 16px -6px rgba(242, 179, 61, .8); }
.pkg-top { display: flex; align-items: center; gap: var(--s-2); }
.pkg-name { font-family: var(--f-display); font-size: var(--t-20); font-weight: 700; }

.pkg-sub { font-size: var(--t-14); color: var(--muted); min-height: 2.8em; }

.pkg-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-2); }

.pkg-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.pkg-stats span { display: grid; gap: 0; padding: var(--s-2); border-radius: 12px; background: var(--sunk); font-size: var(--t-14); color: var(--muted); text-align: center; }

.pkg-cover { display: grid; gap: var(--s-1); font-size: var(--t-14); color: var(--muted); }

.pkg-feat { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-2); font-size: var(--t-14); }

.pkg-best .pkg-list summary { color: #FFFFFF; }
.pkg-list ul { margin: 0; padding-left: var(--s-4); display: grid; gap: var(--s-1); }
.pkg-best .muted { color: #9FC3CD; }

/* course: player + robot teacher */
.crs-head { display: grid; gap: var(--s-3); }
.crs-head h1 { font-size: var(--t-32); margin-top: var(--s-2); }
.crs-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: var(--s-4); align-items: start; }
@media (max-width: 960px) { .crs-grid { grid-template-columns: minmax(0, 1fr); } }
.crs-main { display: grid; gap: var(--s-4); min-width: 0; }
.player { padding: 0; overflow: hidden; box-shadow: var(--shadow-2); scroll-margin-top: 84px; }
.screen { position: relative; background: var(--surface); aspect-ratio: 16 / 9; border-bottom: 1px solid var(--line); }

.screen > svg { background: var(--surface); font-family: var(--f-sans); }
.subs { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92%, 720px); padding: 8px 14px; border-radius: 12px; background: rgba(10, 20, 26, .82); color: #F3F8FA; font-size: var(--t-16); line-height: 1.45; text-align: center; backdrop-filter: blur(4px); }

.bigplay { position: absolute; inset: 0; margin: auto; width: 72px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: var(--on-primary); background: color-mix(in srgb, var(--primary) 88%, transparent); box-shadow: 0 0 0 10px color-mix(in srgb, var(--primary) 18%, transparent), var(--shadow-2); transition: transform var(--dur) var(--spring), opacity var(--dur); }
.bigplay .ico { width: 30px; height: 30px; transform: translateX(2px); fill: currentColor; }
.bigplay:hover { transform: scale(1.08); }
.player.playing .bigplay { opacity: 0; pointer-events: none; transform: scale(.8); }
@media (prefers-reduced-motion: no-preference) { .player:not(.playing) .bigplay { animation: beat 2.4s ease-in-out infinite; } }
.ctrls { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); }
.cbtn { min-width: var(--tap); min-height: var(--tap); border-radius: 12px; border: 0; background: var(--sunk); color: var(--ink); display: grid; place-items: center; cursor: pointer; font-weight: 700; font-size: var(--t-14); transition: background var(--dur), transform 150ms; }
.cbtn:hover { background: var(--primary-tint); color: var(--primary); }
.cbtn:active { transform: scale(.95); }
.cbtn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.txtb { padding: 0 var(--s-2); }
.tl { font-size: var(--t-14); color: var(--muted); white-space: nowrap; }
.seek { flex: 1; min-width: 60px; height: var(--tap); -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; --fill: 0%; }
.seek::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--primary) var(--fill), var(--sunk) var(--fill)); }
.seek::-moz-range-track { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--primary) var(--fill), var(--sunk) var(--fill)); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); box-shadow: var(--shadow-1); }
.seek::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); }
@media (max-width: 560px) { #spdBtn, #vcBtn { display: none; } }
.chaps { display: flex; gap: var(--s-2); overflow-x: auto; padding: 0 var(--s-3) var(--s-3); scrollbar-width: thin; }
.chap { flex: none; max-width: 220px; min-height: var(--tap); display: flex; gap: var(--s-2); align-items: center; text-align: left; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: var(--t-14); cursor: pointer; transition: border-color var(--dur), background var(--dur), color var(--dur); }
.chap span { color: var(--primary); font-weight: 700; }
.chap:hover { border-color: var(--line-strong); color: var(--ink); }
.chap.on { border-color: var(--primary); background: var(--primary-tint); color: var(--ink); }
.lessons .lsn { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.lsn-b { width: 100%; min-height: 52px; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; text-align: left; padding: 6px var(--s-3) 6px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; transition: border-color var(--dur), transform var(--dur) var(--ease); }
.lsn-b:hover { transform: translateX(3px); border-color: var(--line-strong); }
.lsn-b.on { border-color: var(--primary); background: var(--primary-tint); }
.lsn-n { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--primary); font-weight: 800; border: 1px solid var(--line); }
.lsn-b.on .lsn-n { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.own { display: grid; gap: var(--s-2); margin-top: var(--s-3); padding: var(--s-3); border-radius: 14px; border: 1px dashed var(--line-strong); }
.own label { cursor: pointer; }
/* robot teacher */
.bot { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: var(--s-3); padding: var(--s-3); background: linear-gradient(170deg, var(--primary-tint), var(--surface) 40%); border-color: color-mix(in srgb, var(--primary) 25%, var(--line)); box-shadow: var(--shadow-2); }
@media (max-width: 960px) { .bot { position: static; } }
.bot-head { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
.bot-acts { margin-left: auto; display: flex; gap: var(--s-2); }
.bot-acts [hidden] { display: none; }
.bot-modes { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--sunk); }
.bot-modes button { flex: 1; min-height: 40px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: var(--t-14); font-weight: 600; cursor: pointer; }
.bot-modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.bot-mem { font-size: var(--t-14); }
.bot-mem summary { cursor: pointer; color: var(--muted); min-height: var(--tap); display: flex; align-items: center; }
.bot-mem ul { margin: var(--s-2) 0; padding-left: 18px; display: grid; gap: 4px; }
.bot-mem .btn { margin-top: var(--s-2); }
.bot-head b { font-family: var(--f-display); font-size: var(--t-20); }
.bot-state { font-size: var(--t-14); }
.robot-box { width: 72px; height: 76px; flex: none; }
.robot { width: 100%; height: 100%; overflow: visible; }
.rb-ant { fill: var(--gold); }
.rb-eye { fill: #7ADCEE; transform-box: fill-box; transform-origin: center; }
.rb-mouth rect { fill: #7ADCEE; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .robot { animation: float 3.2s ease-in-out infinite; }
  .rb-eye { animation: blink 4.5s infinite; }
  [data-state="thinking"] .rb-ant { animation: glow .8s ease-in-out infinite; }
  [data-state="thinking"] .rb-eye { animation: look 1.6s ease-in-out infinite; }
  [data-state="talking"] .rb-mouth rect { animation: talk .36s ease-in-out infinite; }
  [data-state="talking"] .rb-mouth rect:nth-child(2) { animation-delay: .12s; }
  [data-state="talking"] .rb-mouth rect:nth-child(3) { animation-delay: .24s; }
}
@keyframes float { 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes look { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-2px); } 70% { transform: translateX(2px); } }
@keyframes glow { 50% { fill: #FFFFFF; filter: drop-shadow(0 0 4px var(--gold)); } }
@keyframes talk { 50% { transform: scaleY(2.6); } }
.chat { display: grid; gap: var(--s-2); max-height: 420px; min-height: 160px; overflow-y: auto; padding-right: 4px; align-content: start; }
.msg-b { display: grid; gap: 4px; max-width: 92%; }

.msg-b .mb-text ul { margin: 4px 0 0; padding-left: 18px; }
.msg-b.from-bot .mb-text { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg-b.from-me { justify-self: end; justify-items: end; }
.msg-b.from-me .mb-text { background: var(--primary); color: var(--on-primary); border-top-right-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .msg-b { animation: rise 260ms var(--ease) both; } }
.tstamp { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); background: var(--gold-tint); color: var(--gold-ink); font-size: var(--t-14); font-weight: 700; cursor: pointer; }
.tstamp .ico { width: 14px; height: 14px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); opacity: .4; }
@media (prefers-reduced-motion: no-preference) { .typing i { animation: dotj 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; } }
@keyframes dotj { 50% { transform: translateY(-4px); opacity: 1; } }
.chips-q { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.qchip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: var(--t-14); font-weight: 600; cursor: pointer; transition: background var(--dur), border-color var(--dur), transform 150ms; }
.qchip:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.qchip:active:not(:disabled) { transform: scale(.96); }
.qchip:disabled { opacity: .5; cursor: not-allowed; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2); }
.ask .btn { min-width: 48px; padding: 0 14px; }
.aloud { display: flex; gap: var(--s-2); align-items: center; font-size: var(--t-14); color: var(--muted); min-height: var(--tap); cursor: pointer; }
.aloud input { width: 18px; height: 18px; accent-color: var(--primary); }
.crs-cta { margin-top: var(--s-2); }

.py-head p { max-width: 60ch; margin-top: var(--s-2); }
.py-score { display: flex; gap: var(--s-3); align-items: center; padding: var(--s-2) var(--s-3); border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); min-width: min(100%, 340px); }
.py-pts { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, var(--gold), color-mix(in srgb, var(--gold) 60%, #FF9F43)); color: #3A2600; flex: none; line-height: 1; }

  :root[data-subj="eng"]:not([data-theme="light"]) { --primary: #FF9DB5; --primary-2: #FFB8C9; --primary-tint: #43242D; --accent: #FF9DB5; --accent-tint: #43242D; --on-primary: #3A0716; --cover: var(--cv-eng); }

}

/* notebook cover for the selected subject */
.cover { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); align-items: center; gap: var(--s-3); min-height: 200px; padding: var(--s-4); border-radius: var(--r); background-color: var(--cover); color: #FFFFFF;
  background-image: linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px); background-size: 20px 20px; }
.cover::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 14px; background: rgba(0, 0, 0, .18); box-shadow: 1px 0 0 rgba(255, 255, 255, .12); }
.cover-label { position: relative; z-index: 1; margin-left: var(--s-2); padding: var(--s-2) var(--s-3) var(--s-3); border-radius: 6px; background: #FFFFFF; color: #1A2233; border: 3px double #8A95A9; display: grid; gap: 2px; box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }

.cover-label b { font-family: var(--f-display); font-size: var(--t-20); line-height: 1.2; }
.cover-label .cl-name { margin-top: 6px; padding-top: 2px; border-bottom: 1px solid #8A95A9; min-height: 30px; font-family: var(--f-hand); font-size: 24px; line-height: 1.1; color: #2340A8; }
.cover-art { position: relative; justify-self: end; width: 100%; max-width: 380px; height: auto; color: rgba(255, 255, 255, .9); overflow: visible; }
.cover-art .a-soft { opacity: .45; }

@media (max-width: 640px) { .cover { grid-template-columns: minmax(0, 1fr); min-height: 0; padding: var(--s-3) var(--s-3) var(--s-3) 28px; } .cover-art { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); width: 260px; opacity: .35; } .cover-label { margin-left: 0; max-width: 240px; } }

/* left sidebar */
.tab .ico, .side-subj { display: none; }

/* knowledge map as notebook cells */
.cm { overflow-x: auto; margin-inline: calc(var(--s-4) * -1); padding-inline: var(--s-4); }
@media (max-width: 640px) { .cm { margin-inline: calc(var(--s-3) * -1); padding-inline: var(--s-3); } }
.cm-grid { display: grid; grid-template-columns: 148px repeat(var(--ng), minmax(104px, 1fr)); min-width: calc(148px + var(--ng) * 104px); border-top: 1px solid var(--line); }
.cm-h { font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 10px 8px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--grid); }
.cm-corner { border-left: 0; }
.cm-s { display: flex; align-items: center; padding: 8px 10px 8px 0; font-size: var(--t-14); font-weight: 600; line-height: 1.25; border-bottom: 1px solid var(--grid); }
.cm-cell { display: flex; flex-wrap: wrap; align-content: center; gap: 5px; padding: 8px 10px; min-height: 48px; border-bottom: 1px solid var(--grid); border-left: 1px solid var(--grid); }
.cm-t { position: relative; width: 30px; height: 30px; padding: 0; border-radius: 4px; border: 1.5px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; font: 700 15px/1 var(--f-sans); cursor: pointer; transition: opacity 200ms, transform 150ms, box-shadow 150ms; }
.cm-t:hover { transform: scale(1.12); z-index: 1; }
.cm-t.k-known { background: var(--ok-tint); border-color: var(--ok); color: var(--ok); }
.cm-t.k-gap { border-color: var(--pen); color: var(--pen); }
.cm-t.k-root { background: var(--pen); border-color: var(--pen); color: var(--on-gap); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--pen); }
.cm-t.k-unknown { border-style: dashed; border-color: var(--unk); }
.cm-t.k-na { opacity: .35; }
.cm-t.unt::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); border: 1.5px solid var(--surface); }
.cm-t:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.cm-grid.has-sel .cm-t:not(.rel):not(.on) { opacity: .2; }
.cm-t.on { outline: 3px solid var(--primary); outline-offset: 2px; transform: scale(1.12); }
.cm-t.rel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--primary) 55%, transparent); }
.cm-line { margin-top: var(--s-3); min-height: 24px; font-size: var(--t-14); color: var(--muted); }
.cm-line.on { color: var(--ink); font-weight: 600; }

/* how it works: one stage, four steps */
.how2 { display: grid; gap: var(--s-3); }

.hs i { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--primary); }

  const node = id => svg.querySelector(`.hn[data-id="${id}"]`);
  const edge = (a, b) => svg.querySelector(`.he[data-a="${a}"][data-b="${b}"]`);
  const setSt = (id, st) => { const n = node(id); if (n) n.dataset.st = st; };
  const anc = id => M.ids.filter(x => G.BY[id].anc.has(x));
  const weeks = Math.max(1, Math.ceil(res.path.length / 3));
  const caps = [X.cap[0](G.TOPICS.length), X.cap[1](M.X ? nm(G, M.X) : '', nm(G, M.chain[M.chain.length - 1])), X.cap[2](nm(G, M.root), M.pres.length > 0), X.cap[3](nm(G, M.root), res.path.length, weeks)];
  const top = M.chain[M.chain.length - 1];
  const S = [
    { // 1: the graph draws itself grade by grade
      run() { let t = 0; M.grades.forEach(g => { const col = M.ids.filter(id => G.BY[id].grade === g); at(t, () => col.forEach(id => node(id).classList.add('in'))); at(t + 250, () => M.E.forEach(([a, b]) => { if (G.BY[b].grade === g || G.BY[a].grade === g) { const e = edge(a, b); if (node(a).classList.contains('in') && node(b).classList.contains('in')) e.classList.add('on'); } })); t += 650; }); return t + 900; },
      fin() { svg.querySelectorAll('.hn').forEach(n => n.classList.add('in')); svg.querySelectorAll('.he').forEach(e => e.classList.add('on')); } },
    { // 2: one right answer settles its prerequisites; one wrong answer raises a flag
      run() { let t = 0; if (M.X) { at(t, () => setSt(M.X, 'ask')); t += 900; at(t, () => setSt(M.X, 'ok')); t += 400; anc(M.X).forEach(a => { at(t, () => { setSt(a, 'ok'); const e = edge(a, M.X); if (e) e.classList.add('okp'); }); t += 300; }); t += 500; }
        at(t, () => setSt(top, 'ask')); t += 900; at(t, () => setSt(top, 'bad')); return t + 1200; },
      fin() { if (M.X) { setSt(M.X, 'ok'); anc(M.X).forEach(a => { setSt(a, 'ok'); const e = edge(a, M.X); if (e) e.classList.add('okp'); }); } setSt(top, 'bad'); } },
    { // 3: walk down the chain to the root
      run() { let t = 200; for (let i = M.chain.length - 2; i >= 0; i--) { const a = M.chain[i], b = M.chain[i + 1]; at(t, () => { edge(a, b).classList.add('probe'); setSt(a, 'ask'); }); t += 800; at(t, () => setSt(a, 'bad')); t += 400; }
        M.pres.forEach(p => { at(t, () => setSt(p, 'ask')); t += 600; at(t, () => setSt(p, 'ok')); t += 300; });
        at(t, () => { setSt(M.root, 'root'); svg.classList.add('pen'); }); return t + 1800; },
      fin() { for (let i = M.chain.length - 2; i >= 0; i--) { edge(M.chain[i], M.chain[i + 1]).classList.add('probe'); setSt(M.chain[i], 'bad'); } M.pres.forEach(p => setSt(p, 'ok')); setSt(M.root, 'root'); svg.classList.add('pen'); } },
    { // 4: the plan climbs back up from the root
      run() { let t = 200; at(0, () => svg.classList.add('plan')); M.chain.forEach((id, i) => { at(t, () => { svg.querySelector(`.hp[data-i="${i}"]`).classList.add('in'); if (i) edge(M.chain[i - 1], id).classList.add('plan'); }); t += 700; }); return t + 1600; },
      fin() { svg.classList.add('plan'); M.chain.forEach((id, i) => { svg.querySelector(`.hp[data-i="${i}"]`).classList.add('in'); if (i) edge(M.chain[i - 1], id).classList.add('plan'); }); } },
  ];
  const reset = () => { svg.classList.remove('pen', 'plan'); svg.querySelectorAll('.hn').forEach(n => { n.classList.remove('in'); n.dataset.st = ''; }); svg.querySelectorAll('.he').forEach(e => e.classList.remove('on', 'okp', 'probe', 'plan')); svg.querySelectorAll('.hp').forEach(h => h.classList.remove('in')); };
  const btn = $('#howPlay'), cap = $('#howCap');
  const setBtn = () => { const lbl = HOW.playing ? X.pause : HOW.done ? X.replay : X.play; btn.innerHTML = `${ico(HOW.playing ? 'pause' : 'play')}<span>${lbl}</span>`; btn.hidden = !MOTION; };
  const mark = (k, dur) => box.querySelectorAll('.hs').forEach((b, i) => { b.classList.toggle('done', i < k); if (i === k) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); const bar = b.querySelector('i'); bar.style.animation = 'none'; bar.getBoundingClientRect(); bar.style.animation = i === k && dur ? `howbar ${dur}ms linear forwards` : ''; bar.style.width = i < k || (i === k && !dur) ? '100%' : ''; });
  const go = (k, animate) => {
    HOW.timers.forEach(clearTimeout); HOW.timers = []; HOW.step = k;
    svg.classList.add('instant'); reset(); for (let i = 0; i < k; i++) S[i].fin(); svg.getBoundingClientRect(); svg.classList.remove('instant');
    cap.textContent = caps[k];
    if (animate && MOTION) { const d = S[k].run(); mark(k, d); if (HOW.playing) at(d + 600, () => { if (k < 3) go(k + 1, true); else { HOW.playing = false; HOW.done = true; setBtn(); } }); }
    else { svg.classList.add('instant'); S[k].fin(); svg.getBoundingClientRect(); svg.classList.remove('instant'); mark(k, 0); }
    setBtn();
  };
  box.querySelectorAll('.hs').forEach(b => b.addEventListener('click', () => { HOW.playing = false; HOW.done = false; go(+b.dataset.k, true); }));
  btn.addEventListener('click', () => {
    if (HOW.playing) { HOW.playing = false; HOW.timers.forEach(clearTimeout); go(HOW.step, false); return; }
    const restart = HOW.done || HOW.step === 3; HOW.playing = true; HOW.done = false; go(restart ? 0 : HOW.step, true);
  });
  go(0, false);
  if (MOTION && 'IntersectionObserver' in window) {
    HOW.obs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && !HOW.started) { HOW.started = true; HOW.playing = true; go(0, true); HOW.obs.disconnect(); } }, { threshold: .45 });
    HOW.obs.observe(box);
  }
}

// ---------- test ----------
function startTest(demo) {
  if (S.test) clearTimeout(S.test.timer);
  const G = SUBJ[S.subj], grade = demo || G.key === 'eng' ? 9 : S.grade;
  S.test = { G, engine: Engine({ graph: G, grade }), demo, auto: demo, paused: false, step: null, q: null, n: 0, log: [], seed: Math.floor(Math.random() * 1e6), truth: demo ? truthFromRoots(G, SM[G.key].demo) : null, name: demo ? null : S.name.trim(), logged: new Set(), busy: false, picked: null };
  S.view = 'test';
  nextQ(true);
  window.scrollTo({ top: 0 });
}
function logRoots(step) {
  const X = S.test, res = X.engine.result();
  res.certainRoots.forEach(r => { if (!X.logged.has(r) && (!step || step.from !== r)) { X.logged.add(r); X.log.unshift({ id: r, kind: 'root' }); } });
}
function nextQ(first) {
  const X = S.test; if (!X) return;
  const step = X.engine.next();
  logRoots(step);
  if (!step) { finishTest(); return; }
  X.step = step; X.n++; X.busy = false; X.picked = null;
  X.q = X.G.BY[step.id].gen(rng(X.seed + X.n * 101 + X.G.RANK[step.id] * 7));
  if (first) { S.view = 'test'; render(); } else renderTest();
  if (X.auto) X.timer = setTimeout(autoThink, 650);
}
function autoThink() {
  const X = S.test; if (!X || !X.auto || X.busy) return;
  const known = !X.truth.has(X.step.id);
  const idx = known ? X.q.a : (X.q.a + 1 + Math.floor(Math.random() * 3)) % 4;
  const btn = document.querySelector(`.opt[data-i="${idx}"]`); if (btn) btn.classList.add('is-think');
  X.timer = setTimeout(() => choose(idx), 450);
}
function choose(idx) {
  const X = S.test; if (!X || X.busy) return;
  X.busy = true; X.picked = idx;
  const correct = idx === X.q.a;
  X.engine.answer(X.step.id, correct, { reason: X.step.reason, choice: idx, q: X.q });
  X.log.unshift({ id: X.step.id, kind: idx < 0 ? 'dk' : correct ? 'ok' : 'bad' });
  markOptions(); updateEngine();
  X.timer = setTimeout(() => nextQ(false), X.auto ? 750 : 700);
}
function finishTest() {
  const X = S.test; if (!X) return;
  clearTimeout(X.timer);
  S.result = { engine: X.engine, name: X.name, nameKey: X.demo ? 'virt' : (X.name ? null : 'student'), demo: X.demo, date: new Date() };
  S.test = null;
  go('result');
}
function skipToEnd() {
  const X = S.test; if (!X) return;
  clearTimeout(X.timer);
  if (X.demo) { let st; while ((st = X.engine.next())) X.engine.answer(st.id, !X.truth.has(st.id), { reason: st.reason }); }
  finishTest();
}

function svgSrc(svg) {
  if (typeof svg !== 'string') return null;
  let x = svg.trim();
  if (!/^<svg[\s>]/i.test(x) || !/<\/svg>\s*$/i.test(x) || x.length > 12000) return null;
  if (/<script|<image|<foreignObject|<iframe|<use|\bon\w+\s*=|href\s*=|url\(|@import|<!ENTITY|<!DOCTYPE/i.test(x)) return null;
  if (!/xmlns=/.test(x)) x = x.replace(/^<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(x);
}

function classStep(key, count) { // simulate the next `count` students of a class; returns true when the class is complete

    const i = P.students.length;
    let roots = W.filter(([, w]) => P.R() < w).map(x => x[0]);
    roots = roots.filter(r => !roots.some(o => o !== r && G.BY[o].descD.has(r)));
    const gap = truthFromRoots(G, roots), rr = rng(500 + i), e = Engine({ graph: G, grade: 9 });
    let st; while ((st = e.next())) e.answer(st.id, gap.has(st.id) ? rr() < 0.2 : rr() > 0.03, { reason: st.reason });
    P.students.push({ name: NAMES[i], engine: e, res: e.result() });

function buildClass(key) {

  const topRoots = Object.entries(rootCount).sort((a, b) => b[1] - a[1]);

  const deep = Math.round(100 * students.filter(s => s.res.roots.some(r => G.BY[r].grade <= 6)).length / n);

        <ul>${uu.lessons.map(ll => `<li><button type="button" class="py-lb${ll.id === l.id ? ' on' : ''}" data-l="${ll.id}">${lessonDone(ll) ? `<span class="py-dot ok">${ico('check')}</span>` : '<span class="py-dot"></span>'}${esc(tr(ll.title))}</button></li>`).join('')}</ul></div>`; }).join('')}
    </nav>
    <article class="py-main">
      <div class="card py-lesson">
        <div class="muted py-crumb">${esc(tr(u.title))} · ${idx + 1}/${PY_ALL.length}</div>
        <h2>${esc(tr(l.title))}</h2>
        <div class="py-body">${l.body.map(p => `<p>${esc(tr(p))}</p>`).join('')}</div>
        <div class="py-ex"><div class="py-ex-h"><b>${X.example}</b><button class="btn btn-ghost btn-sm" type="button" data-run-ex>${ico('play')}${X.run}</button></div>
          <textarea class="py-code" id="ed-ex" spellcheck="false" aria-label="${X.example}">${esc(l.example)}</textarea>
          <div class="py-out" id="out-ex" hidden></div></div>
      </div>
      ${l.tasks.map((t, ti) => { const solved = PYS.solved.includes(t.id); return `<section class="card py-task${solved ? ' solved' : ''}" id="task-${t.id}">
        <div class="py-th"><span class="py-tn">${solved ? ico('check') : ti + 1}</span><div><div class="muted">${X.task} ${ti + 1}${solved ? ' · ' + X.done : ''}</div><p class="py-prompt">${esc(tr(t.prompt))}</p></div></div>
        ${t.kind === 'out' && t.tests[0].stdin.length ? `<div class="py-in muted">${X.input}: <code>${esc(t.tests[0].stdin.join(' ⏎ '))}</code></div>` : ''}
        <textarea class="py-code" id="ed-${t.id}" spellcheck="false" aria-label="${esc(X.task + ' ' + (ti + 1))}">${esc(PYS.drafts[t.id] !== undefined ? PYS.drafts[t.id] : t.starter)}</textarea>
        <div class="row py-act">
          <button class="btn btn-primary btn-sm" type="button" data-check="${t.id}">${ico('check')}${X.check}</button>
          <button class="btn btn-ghost btn-sm" type="button" data-run="${t.id}">${ico('play')}${X.run}</button>
          <button class="btn btn-ghost btn-sm" type="button" data-hint="${t.id}">${X.hint}</button>
          <button class="btn btn-ghost btn-sm" type="button" data-help="${t.id}">${ROBOT_MINI}${X.help}</button>
          <button class="btn btn-ghost btn-sm" type="button" data-sol="${t.id}" ${(PYS.fails[t.id] || 0) >= 2 || solved ? '' : 'hidden'}>${X.showSol}</button>
        </div>
        <div class="py-hint" id="hint-${t.id}" hidden>${esc(tr(t.hint))}</div>
        <div class="py-out" id="out-${t.id}" hidden></div>
        <div class="py-res" id="res-${t.id}" aria-live="polite"></div>
        <div class="py-bot" id="bot-${t.id}" hidden></div>
      </section>`; }).join('')}
      <div class="py-nav">${idx > 0 ? `<button class="btn btn-ghost" type="button" data-go="${PY_ALL[idx - 1].l.id}">${X.prev}</button>` : '<span></span>'}${idx < PY_ALL.length - 1 ? `<button class="btn btn-primary" type="button" data-go="${PY_ALL[idx + 1].l.id}">${X.next}${ico('arrow')}</button>` : ''}</div>
    </article>
  </div>`;
  Object.keys(editors).forEach(k => delete editors[k]);
  const getCode = id => (editors[id] ? editors[id].getValue() : $('#ed-' + id).value);
  const mkEditors = () => document.querySelectorAll('#v-python .py-code').forEach(ta => {
    const id = ta.id.slice(3);
    if (window.CodeMirror) {
      const cm = CodeMirror.fromTextArea(ta, { mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, viewportMargin: Infinity, lineWrapping: true, extraKeys: { Tab: c => c.replaceSelection('    '), 'Ctrl-Enter': () => { const b = document.querySelector(`[data-check="${id}"]`) || document.querySelector('[data-run-ex]'); if (b) b.click(); } } });
      cm.getInputField().setAttribute('aria-label', ta.getAttribute('aria-label') + ' · Python');
      editors[id] = cm; if (id !== 'ex') cm.on('change', () => { PYS.drafts[id] = cm.getValue(); pySave(); });
    } else if (id !== 'ex') ta.addEventListener('input', () => { PYS.drafts[id] = ta.value; pySave(); });
    if (!window.CodeMirror) ta.addEventListener('keydown', e => { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); } });
  });
  loadCM().then(mkEditors, mkEditors);
  loadPython().catch(() => {});
  const showOut = (box, r, stdin) => { box.hidden = false; box.classList.toggle('err', !!r.err); box.innerHTML = `<div class="py-out-h">${PYT().output}${stdin && stdin.length ? ` <span class="muted">· ${PYT().input}: ${esc(stdin.join(' ⏎ '))}</span>` : ''}</div><pre>${esc((r.out || '') + (r.err ? (r.out ? '\n' : '') + r.err : '') || PYT().noOutput)}</pre>`; };
  const busy = (b, on) => { if (on) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy'); };
  const withPy = async (b, box, fn) => { busy(b, true); try { await loadPython(); await fn(); } catch (e) { box.hidden = false; box.className = 'py-out err'; box.textContent = PYT().loadFail; } finally { busy(b, false); } };
  if (pyBound) return;
  pyBound = true;
  $('#v-python').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.l || b.dataset.go) { PYS.lesson = b.dataset.l || b.dataset.go; pySave(); renderPy(); window.scrollTo({ top: 0, behavior: MOTION ? 'smooth' : 'auto' }); return; }
    if (b.hasAttribute('data-run-ex')) { const box = $('#out-ex'); return withPy(b, box, async () => showOut(box, await runPy(getCode('ex')))); }
    const id = b.dataset.run || b.dataset.check || b.dataset.hint || b.dataset.help || b.dataset.sol; if (!id) return;
    const t = PY_TASKS.find(x => x.id === id);
    if (b.dataset.run) { const box = $('#out-' + id), stdin = t.kind === 'out' ? t.tests[0].stdin : []; return withPy(b, box, async () => showOut(box, await runPy(getCode(id), stdin), stdin)); }
    if (b.dataset.hint) { const h = $('#hint-' + id); h.hidden = !h.hidden; return; }
    if (b.dataset.sol) { const code = t.solution; if (editors[id]) editors[id].setValue(code); else $('#ed-' + id).value = code; return; }
    if (b.dataset.check) return withPy(b, $('#res-' + id), async () => {
      const res = await checkTask(t, getCode(id)), ok = res.every(r => r.ok), box = $('#res-' + id), X2 = PYT();
      box.innerHTML = `<div class="py-verdict ${ok ? 'ok' : 'bad'}">${ok ? ico('check') + X2.pass : X2.partial(res.filter(r => r.ok).length, res.length)}</div><ul class="py-tests">${res.map((r, i) => `<li class="${r.ok ? 'ok' : 'bad'}"><span class="py-ti">${ico(r.ok ? 'check' : 'x')}</span><code>${esc(r.label)}</code>${r.ok ? '' : `<span class="py-diff"><span>${X2.expected}: <code>${esc(r.exp)}</code></span><span>${X2.got}: <code>${esc(r.got || '∅')}</code></span></span>`}</li>`).join('')}</ul>`;
      const card = $('#task-' + id);
      if (ok && !PYS.solved.includes(id)) { PYS.solved.push(id); pySave(); card.classList.add('solved', 'celebrate'); celebrate(card); const pts = $('#pyPts'); if (pts) pts.textContent = PYS.solved.length * 10; setTimeout(() => { if (S.view === 'python') renderPyKeepScroll(); }, 1800); }
      if (!ok) { PYS.fails[id] = (PYS.fails[id] || 0) + 1; pySave(); if (PYS.fails[id] >= 2) { const sb = document.querySelector(`[data-sol="${id}"]`); if (sb) sb.hidden = false; } }
      box.dataset.res = JSON.stringify(res);
    });
    if (b.dataset.help) {
      const out = $('#bot-' + id), sample = await samplePromise; out.hidden = false;
      if (!sample) { out.innerHTML = `<p class="muted">${PYT().botOff}</p>`; return; }
      busy(b, true); out.innerHTML = `<div class="py-bot-h">${ROBOT_MINI}<b>Ұстаз-бот</b></div><p class="muted">${PYT().botThinking}</p>`;
      const prev = $('#res-' + id).dataset.res || '[]';
      const prompt = `Ты «Ұстаз-бот» — терпеливый учитель информатики для школьника 12–17 лет (курс Python, как на Khan Academy).
Задание: ${tr(t.prompt)}
Код ученика:
\`\`\`python
${getCode(id)}
\`\`\`
Результаты последней проверки (label, expected, got, ok): ${prev}
Помоги НЕ давая готового решения целиком: 1) коротко скажи, что уже правильно; 2) укажи конкретную ошибку или следующий шаг (строку кода можно назвать); 3) дай наводящий вопрос или маленький пример, не совпадающий с ответом. 3–6 предложений, код — только короткие фрагменты в обратных кавычках. Язык ответа: ${lang === 'kk' ? 'казахский' : 'русский'}.`;
      try { await sample(prompt, { cache: false, onText: ({ text }) => { out.innerHTML = `<div class="py-bot-h">${ROBOT_MINI}<b>Ұстаз-бот</b></div>${mdHTML(text.replace(/`([^`]+)`/g, '$1'))}`; } }); }
      catch (err) { out.innerHTML = `<p class="muted">${esc((CT().err[err && err.code]) || CT().err.other)}</p>`; }
      finally { busy(b, false); }
    }
  });
}
window.__olqPy = { PY_TASKS, PY_ALL, checkTask, runPy, curLesson, PYS };
function renderPyKeepScroll() { const y = window.scrollY; renderPy(); window.scrollTo({ top: y }); }
function celebrate(el) {
  if (!MOTION) return;
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  const cols = ['var(--gold)', 'var(--primary)', 'var(--ok)', 'var(--primary-2)', 'var(--gap)'];
  for (let i = 0; i < 28; i++) { const s = document.createElement('i'); s.style.cssText = `--x:${(Math.random() * 2 - 1) * 180}px;--y:${-60 - Math.random() * 140}px;--r:${Math.random() * 540}deg;background:${cols[i % 5]};left:${20 + Math.random() * 60}%;animation-delay:${Math.random() * 120}ms`; box.appendChild(s); }
  el.appendChild(box); setTimeout(() => box.remove(), 1600);
}
function openPython() { S.view = 'python'; try { history.replaceState(null, '', '#python'); } catch (e) {} render(); window.scrollTo({ top: 0 }); }

const ROBOT_MINI = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 15.5h5"/></svg>';
// ---------- boot ----------
const h0 = location.hash.slice(1);
S.view = h0 === 'class' ? 'cls' : h0 === 'result' ? 'result' : h0 === 'course' ? 'course' : h0 === 'python' ? 'python' : 'home';
render();
// precompute demo results and class data while the browser is idle
const idle = cb => (window.requestIdleCallback ? requestIdleCallback(cb, { timeout: 3000 }) : setTimeout(cb, 300));
const warmQueue = [S.subj, ...SUBJ_KEYS.filter(k => k !== S.subj)].flatMap(k => [() => demoResult(k), ...Array.from({ length: 7 }, () => () => classStep(k, 4))]);
const warm = () => { const f = warmQueue.shift(); if (f) { f(); idle(warm); } };
idle(warm);
})();
